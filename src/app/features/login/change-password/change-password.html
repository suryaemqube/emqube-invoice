<div class="eq-changepw">
  <div class="eq-changepw-card">
    <h1 class="eq-form-card-title">Change Password</h1>

    @if (loading) {
      <div class="eq-loading-block">Saving…</div>
    }

    <div class="eq-form-grid">
      <div class="eq-field eq-field-wide">
        <label>Old Password</label>
        <div class="eq-password-wrap">
          <input
            [type]="passVisible.old ? 'text' : 'password'"
            [(ngModel)]="oldPassword"
            placeholder="Old password"
            autocomplete="current-password"
            (keyup.enter)="save()"
          />
          <button type="button" class="eq-password-toggle"
                  [attr.aria-label]="passVisible.old ? 'Hide old password' : 'Show old password'"
                  [title]="passVisible.old ? 'Hide password' : 'Show password'"
                  (click)="togglePassword('old')">
            <i [class]="passVisible.old ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="eq-field eq-field-wide">
        <label>New Password</label>
        <div class="eq-password-wrap">
          <input
            [type]="passVisible.new ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            placeholder="New password"
            autocomplete="new-password"
            (keyup.enter)="save()"
          />
          <button type="button" class="eq-password-toggle"
                  [attr.aria-label]="passVisible.new ? 'Hide new password' : 'Show new password'"
                  [title]="passVisible.new ? 'Hide password' : 'Show password'"
                  (click)="togglePassword('new')">
            <i [class]="passVisible.new ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="eq-field eq-field-wide">
        <label>Confirm Password</label>
        <div class="eq-password-wrap">
          <input
            [type]="passVisible.confirm ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
            (keyup.enter)="save()"
          />
          <button type="button" class="eq-password-toggle"
                  [attr.aria-label]="passVisible.confirm ? 'Hide confirm password' : 'Show confirm password'"
                  [title]="passVisible.confirm ? 'Hide password' : 'Show password'"
                  (click)="togglePassword('confirm')">
            <i [class]="passVisible.confirm ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="eq-changepw-actions">
      <button class="eq-btn eq-btn-ghost" type="button" (click)="backToList()">
        <i class="icon-arrow-left"></i> Back to Invoices
      </button>
      <button class="eq-btn eq-btn-primary" type="button" [disabled]="loading" (click)="save()">
        <i class="icon-check"></i> Save
      </button>
    </div>
  </div>
</div>
